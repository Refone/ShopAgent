[project]
name = "customer-service"
version = "0.1.0"
description = "客户服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2.9",
    "pydantic-settings>=2.10.1",
    "pyjwt>=2.10.1",
    "pytest>=9.1.1",
    "redis>=6.2.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.35.0",
]

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [
    "ruff==0.17.6",
]
