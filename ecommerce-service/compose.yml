# 环境变量统一放在 ShopAgent 顶层 .env，启动时需显式指定：
# docker compose --env-file ../.env up -d --build
name: ecommerce-customer-service

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-customer_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-customer_service}
      POSTGRES_DB: ${ECOMMERCE_SERVICE_DB:-ecommerce}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ecommerce_postgres_data:/var/lib/postgresql/data
      - ./postgres_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-customer_service} -d ${ECOMMERCE_SERVICE_DB:-ecommerce}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: ecommerce-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ecommerce_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q '^PONG$'"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        # PyPI 镜像站点，由顶层 .env 的 PIP_MIRROR_HOST 控制。
        # 腾讯云服务器设为 mirrors.tencentyun.com（内网 4-7 MB/s）。
        PIP_MIRROR_HOST: ${PIP_MIRROR_HOST:-mirrors.aliyun.com}
    container_name: ecommerce-app
    ports:
      - "${ECOMMERCE_SERVICE_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-customer_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-customer_service}
      ECOMMERCE_SERVICE_DB: ${ECOMMERCE_SERVICE_DB:-ecommerce}
      JWT_SECRET: ${JWT_SECRET:-ecommerce-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      USER_FRONTEND_HOST: ${USER_FRONTEND_HOST:-127.0.0.1}
      USER_FRONTEND_PORT: ${USER_FRONTEND_PORT:-18100}
      ADMIN_FRONTEND_HOST: ${ADMIN_FRONTEND_HOST:-127.0.0.1}
      ADMIN_FRONTEND_PORT: ${ADMIN_FRONTEND_PORT:-18101}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  ecommerce_postgres_data:
  ecommerce_redis_data:
