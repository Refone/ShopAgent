name: Deploy

# main 分支更新后，通过 SSH 登录云服务器，执行 git pull 后运行 deploy.py。
#
# 必填 repository secrets：
#   DEPLOY_HOST       云服务器 IP / 域名
#   DEPLOY_USER       SSH 用户
#   DEPLOY_SSH_KEY    无口令私钥
#   DEPLOY_ENV        完整 .env 内容
# 可选 repository secrets：
#   DEPLOY_SSH_PORT   SSH 端口，默认 22
#   DEPLOY_PATH       服务器上的仓库路径，默认 $HOME/ShopAgent
#   DEPLOY_KNOWN_HOSTS 固定主机指纹（推荐）
#
# 服务器要求：仓库已 clone 到 DEPLOY_PATH，且 SSH 用户可直接使用
# docker compose v2、uv、Node.js 18+、npm、Python 3.10+、git。
# 云服务器安全组需允许 GitHub Actions runner 访问 SSH 端口。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to cloud server
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_PATH_SECRET: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}

    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          umask 077

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::仅允许部署 main 分支，当前 ref：$GITHUB_REF"
            exit 1
          fi

          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_ENV; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::缺少必需的 GitHub Actions secrets：${missing[*]}"
            {
              echo "## 部署配置缺失"
              echo ""
              echo '请配置以下 repository secrets：`DEPLOY_HOST`、`DEPLOY_USER`、`DEPLOY_SSH_KEY`、`DEPLOY_ENV`。'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          deploy_port="${DEPLOY_SSH_PORT:-22}"
          if ! [[ "$deploy_port" =~ ^[0-9]+$ ]]; then
            echo "::error::DEPLOY_SSH_PORT 必须是数字，当前值：$deploy_port"
            exit 1
          fi
          deploy_port=$((10#$deploy_port))
          if ((deploy_port < 1 || deploy_port > 65535)); then
            echo "::error::DEPLOY_SSH_PORT 超出范围：$deploy_port"
            exit 1
          fi

          if ! [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:_-]*$ ]]; then
            echo "::error::DEPLOY_HOST 格式不合法（只允许域名或 IP）"
            exit 1
          fi
          if ! [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*$ ]]; then
            echo "::error::DEPLOY_USER 格式不合法"
            exit 1
          fi

          ssh_dir="$RUNNER_TEMP/shopagent-deploy"
          install -m 700 -d "$ssh_dir"

          key_file="$ssh_dir/id_deploy"
          printf '%s\n' "${DEPLOY_SSH_KEY%$'\n'}" | tr -d '\r' > "$key_file"
          chmod 600 "$key_file"
          if ! grep -q 'PRIVATE KEY' "$key_file"; then
            echo "::error::DEPLOY_SSH_KEY 不是有效的 SSH 私钥"
            exit 1
          fi

          known_hosts="$ssh_dir/known_hosts"
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "${DEPLOY_KNOWN_HOSTS%$'\n'}" | tr -d '\r' > "$known_hosts"
          else
            echo "::warning::未配置 DEPLOY_KNOWN_HOSTS，改用 ssh-keyscan 临时获取主机指纹。建议固定该 secret。"
            ssh-keyscan -T 10 -p "$deploy_port" -H "$DEPLOY_HOST" > "$known_hosts" 2>/dev/null || true
            if [ ! -s "$known_hosts" ]; then
              echo "::error::ssh-keyscan 无法获取 $DEPLOY_HOST:$deploy_port 的主机指纹"
              exit 1
            fi
          fi

          ssh_config="$ssh_dir/config"
          {
            printf 'Host shopagent-deploy\n'
            printf '  HostName %s\n' "$DEPLOY_HOST"
            printf '  User %s\n' "$DEPLOY_USER"
            printf '  Port %s\n' "$deploy_port"
            printf '  IdentityFile %s\n' "$key_file"
            printf '  IdentitiesOnly yes\n'
            printf '  BatchMode yes\n'
            printf '  UserKnownHostsFile %s\n' "$known_hosts"
            printf '  StrictHostKeyChecking yes\n'
            printf '  ServerAliveInterval 30\n'
            printf '  ServerAliveCountMax 20\n'
            printf '  ConnectTimeout 15\n'
          } > "$ssh_config"
          chmod 600 "$ssh_config"

          {
            echo "SSH_CONFIG=$ssh_config"
          } >> "$GITHUB_ENV"

      - name: Resolve deployment path and check remote prerequisites
        run: |
          set -euo pipefail

          if [ -n "${DEPLOY_PATH_SECRET:-}" ]; then
            deploy_path="$DEPLOY_PATH_SECRET"
          else
            if ! remote_home=$(ssh -F "$SSH_CONFIG" shopagent-deploy 'printf %s "$HOME"'); then
              echo "::error::SSH 连接失败，请检查 DEPLOY_HOST、DEPLOY_USER、DEPLOY_SSH_PORT、DEPLOY_SSH_KEY 和 DEPLOY_KNOWN_HOSTS。"
              exit 1
            fi
            if [ -z "$remote_home" ]; then
              echo "::error::无法获取服务器 HOME 目录，请显式配置 DEPLOY_PATH。"
              exit 1
            fi
            deploy_path="${remote_home%/}/ShopAgent"
          fi

          deploy_path="${deploy_path%/}"
          if [ "$deploy_path" = "/" ] || ! [[ "$deploy_path" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::DEPLOY_PATH 必须是不为根目录的绝对路径，且只能包含字母、数字、. _ / -。"
            exit 1
          fi
          if [[ "$deploy_path" == *".."* ]]; then
            echo "::error::DEPLOY_PATH 不能包含 .."
            exit 1
          fi
          echo "DEPLOY_PATH=$deploy_path" >> "$GITHUB_ENV"

          ssh -F "$SSH_CONFIG" shopagent-deploy "DEPLOY_PATH='$deploy_path' REPO_URL='https://github.com/$GITHUB_REPOSITORY.git' bash -ls" <<'REMOTE'
          set -euo pipefail

          if [ ! -d "$DEPLOY_PATH" ]; then
            echo "::error::部署目录不存在：$DEPLOY_PATH"
            echo "请先在服务器上执行：git clone $REPO_URL '$DEPLOY_PATH'"
            echo "或把 DEPLOY_PATH secret 指向已有克隆。"
            exit 1
          fi

          missing=()
          for command in git python3 docker uv node npm; do
            if ! command -v "$command" >/dev/null 2>&1; then
              missing+=("$command")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::服务器缺少命令：${missing[*]}"
            echo "需要 Docker（含 Compose v2）、uv、Node.js 18+、npm、Python 3.10+、git。"
            exit 1
          fi

          if ! python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)'; then
            echo "::error::服务器 python3 版本过低：$(python3 --version 2>&1)，需要 3.10+。"
            exit 1
          fi

          node_version=$(node --version)
          node_major="${node_version#v}"
          node_major="${node_major%%.*}"
          if ! [[ "$node_major" =~ ^[0-9]+$ ]] || ((node_major < 18)); then
            echo "::error::服务器 Node.js 版本过低：$node_version，需要 18+。"
            exit 1
          fi

          if ! docker info >/dev/null 2>&1; then
            echo "::error::当前 SSH 用户无法访问 Docker，请把用户加入 docker 组或改用有权限的用户。"
            exit 1
          fi
          if ! docker compose version >/dev/null 2>&1; then
            echo "::error::服务器 Docker Compose v2 不可用，需要 docker compose 子命令。"
            exit 1
          fi

          echo "远程环境：$(python3 --version 2>&1) / node $node_version / $(uv --version) / $(git --version)"
          REMOTE

      - name: Update source code
        run: |
          set -euo pipefail

          ssh -F "$SSH_CONFIG" shopagent-deploy "DEPLOY_PATH='$DEPLOY_PATH' TARGET_SHA='$GITHUB_SHA' REPO_URL='https://github.com/$GITHUB_REPOSITORY.git' GIT_TERMINAL_PROMPT=0 bash -ls" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          if [ ! -d .git ]; then
            echo "::error::部署目录不是 git 仓库：$DEPLOY_PATH"
            echo "请先在服务器上执行：git clone $REPO_URL '$DEPLOY_PATH'"
            exit 1
          fi

          git fetch --prune origin main
          git checkout main

          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::服务器仓库存在未提交的已跟踪文件修改，拒绝自动部署。"
            git status --short
            exit 1
          fi

          git pull --ff-only origin main

          server_sha=$(git rev-parse HEAD)
          origin_sha=$(git rev-parse origin/main)
          if [ "$server_sha" != "$origin_sha" ]; then
            echo "::error::服务器本地 main 与 origin/main 不一致，可能包含本地提交，拒绝部署。"
            git log --oneline origin/main..HEAD
            exit 1
          fi

          echo "触发提交：$TARGET_SHA"
          echo "服务器 HEAD：$server_sha"
          git log -1 --format='最新提交：%h %s'
          if [ "$server_sha" != "$TARGET_SHA" ]; then
            echo "::warning::服务器 HEAD 与本次触发提交不同（main 可能已前进，或服务器 origin 不是本仓库）。"
          fi
          REMOTE

      - name: Write production .env
        run: |
          set -euo pipefail

          if ! grep -q '[^[:space:]]' <<< "$DEPLOY_ENV"; then
            echo "::error::DEPLOY_ENV secret 为空。"
            exit 1
          fi

          env_content="$DEPLOY_ENV"
          if [[ "$env_content" != *$'\n' ]]; then
            env_content+=$'\n'
          fi

          env_lines=$(
            printf '%s' "$env_content" | ssh -F "$SSH_CONFIG" shopagent-deploy "umask 077 && : > '$DEPLOY_PATH/.env' && chmod 600 '$DEPLOY_PATH/.env' && cat > '$DEPLOY_PATH/.env' && wc -l < '$DEPLOY_PATH/.env'"
          )
          env_lines="${env_lines//[[:space:]]/}"
          echo "已写入服务器 .env（$env_lines 行，内容不回显）。"

      - name: Deploy
        run: |
          set -euo pipefail

          ssh -F "$SSH_CONFIG" shopagent-deploy "DEPLOY_PATH='$DEPLOY_PATH' PYTHONUNBUFFERED=1 bash -ls" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          if [ ! -s .env ]; then
            echo "::error::服务器 .env 不存在或为空，拒绝使用模板默认配置部署。"
            exit 1
          fi
          if grep -Eq '^(JWT_SECRET=ecommerce-secret|POSTGRES_PASSWORD=customer_service)$' .env; then
            echo "::warning::检测到 .env 仍在使用模板默认的 JWT_SECRET 或 POSTGRES_PASSWORD，请尽快更换。"
          fi

          # 先校验 .env，避免配置错误时白白执行构建。
          python3 deploy.py env
          python3 deploy.py deploy
          REMOTE

      - name: Verify services
        run: |
          set -euo pipefail

          # 新开一个 SSH 会话检查，顺带确认后台服务不会随部署会话退出。
          ssh -F "$SSH_CONFIG" shopagent-deploy "DEPLOY_PATH='$DEPLOY_PATH' PYTHONUNBUFFERED=1 bash -ls" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          python3 deploy.py status --strict
          REMOTE

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## ShopAgent 部署"
            echo ""
            echo "- 触发提交：[\`$GITHUB_SHA\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)"
            echo "- 部署分支：\`main\`"
            echo "- 结果：**${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH key
        if: always()
        run: rm -rf "${RUNNER_TEMP:?}/shopagent-deploy"
